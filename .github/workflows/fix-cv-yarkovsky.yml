name: One-off CV Yarkovsky wording fix

on:
  push:
    branches:
      - fix/cv-yarkovsky-exam-20260821

permissions:
  contents: write

jobs:
  edit-pdfs:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.4 Pillow==11.3.0

      - name: Edit and validate the three CV PDFs
        run: python scripts/fix_cv_yarkovsky.py

      - name: Commit only the three CV PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            documents/paolo-de-marinis-cv-generale.pdf \
            documents/paolo-de-marinis-cv-genai.pdf \
            documents/paolo-de-marinis-cv-crypto.pdf
          if git diff --cached --quiet; then
            echo "Expected PDF changes were not produced."
            exit 1
          fi
          git commit -m "Clarify Yarkovsky exam context in CVs"
          git push origin "HEAD:${GITHUB_REF_NAME}"
