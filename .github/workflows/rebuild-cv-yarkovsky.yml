name: Rebuild CV PDFs for Yarkovsky wording

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install PDF tooling
        run: python -m pip install --disable-pip-version-check PyMuPDF==1.26.4 Pillow==11.3.0

      - name: Rebuild and validate CV PDFs
        run: python scripts/rebuild_cv_yarkovsky.py

      - name: Commit rebuilt PDFs to PR branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- \
            documents/paolo-de-marinis-cv-generale.pdf \
            documents/paolo-de-marinis-cv-genai.pdf \
            documents/paolo-de-marinis-cv-crypto.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes produced."
            exit 1
          fi
          git commit -m "Clarify Planetary Systems exam context in CVs"
          git push origin "HEAD:${{ github.head_ref }}"
